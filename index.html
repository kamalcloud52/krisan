<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak Kritik & Saran Anonim</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: #1a1a2e;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            padding: 40px 36px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.2s;
        }

        .container:hover {
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header-icon {
            font-size: 2.4rem;
            color: #2563eb;
            margin-bottom: 12px;
            display: inline-block;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.5;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        textarea,
        input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            color: #1a1a2e;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        textarea:focus,
        input[type="text"]:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        textarea::placeholder,
        input::placeholder {
            color: #9ca3af;
        }

        /* ===== CUSTOM SELECT ===== */
        .custom-select-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
            font-size: 14px;
            color: #1a1a2e;
        }

        .custom-select-trigger:hover {
            border-color: #2563eb;
            background: #ffffff;
        }

        .custom-select-trigger .chevron {
            color: #6b7280;
            font-size: 12px;
            transition: transform 0.2s;
        }

        .custom-select-trigger .chevron.open {
            transform: rotate(180deg);
        }

        /* ===== DYNAMIC INPUT ===== */
        .dynamic-input-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease, opacity 0.25s;
            opacity: 0;
        }

        .dynamic-input-container.show {
            max-height: 80px;
            margin-top: 10px;
            opacity: 1;
        }

        .dynamic-input-container input {
            background: #f9fafb;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            padding: 10px 14px;
            width: 100%;
            font-size: 14px;
            color: #1a1a2e;
            outline: none;
            transition: all 0.2s;
        }

        .dynamic-input-container input:focus {
            border-color: #2563eb;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        /* ===== BUTTON ===== */
        .btn-submit {
            width: 100%;
            padding: 13px 20px;
            background: #2563eb;
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: none;
        }

        .btn-submit:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-submit .btn-icon {
            font-size: 14px;
        }

        /* ===== FOOTER ===== */
        .footer {
            margin-top: 24px;
            font-size: 12px;
            text-align: center;
            color: #9ca3af;
            border-top: 1px solid #f3f4f6;
            padding-top: 18px;
        }

        .footer i {
            margin: 0 4px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background: #ffffff;
            border-radius: 16px;
            padding: 32px 28px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            transform: scale(0.92) translateY(12px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1) translateY(0);
        }

        /* Modal Kategori */
        .modal-box .modal-title {
            font-size: 18px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 4px;
        }

        .modal-box .modal-sub {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 16px;
        }

        .category-list {
            list-style: none;
            margin-top: 4px;
        }

        .category-item {
            padding: 12px 16px;
            margin-bottom: 6px;
            background: #f9fafb;
            border: 1.5px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
            color: #1a1a2e;
        }

        .category-item:hover {
            background: #f3f4f6;
            border-color: #2563eb;
        }

        .category-item i {
            color: #2563eb;
            width: 20px;
            text-align: center;
            font-size: 14px;
        }

        /* Modal Sukses */
        .success-icon {
            font-size: 3.6rem;
            color: #22c55e;
            margin-bottom: 12px;
        }

        .modal-box .success-title {
            font-size: 20px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .modal-box .success-text {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn-close-modal {
            padding: 10px 28px;
            background: #f3f4f6;
            border: none;
            border-radius: 10px;
            color: #1a1a2e;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-close-modal:hover {
            background: #e5e7eb;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .container {
                padding: 28px 20px;
            }

            h1 {
                font-size: 20px;
            }

            .header-icon {
                font-size: 2rem;
            }
        }

        :root { --ink:#172033; --muted:#65718a; --line:#e3e8f1; --brand:#315ce8; --canvas:#f4f6fb; }
        body { color:var(--ink); background:radial-gradient(ellipse at top left,#eaf0ff 0,transparent 42%),var(--canvas); }
        .container { border:1px solid rgba(215,223,238,.85); box-shadow:0 18px 60px rgba(30,48,88,.09); }
        .header-icon { width:58px; height:58px; display:grid; place-items:center; margin:0 auto 16px; border-radius:18px; background:#eef3ff; }
        label { color:#28344b; }
        textarea, input[type="text"] { border-color:var(--line); background:#fbfcff; }
        textarea:focus, input[type="text"]:focus, .dynamic-input-container input:focus { border-color:var(--brand); }
        .custom-select-trigger { width:100%; text-align:left; font-family:inherit; }
        button, input { font:inherit; }
        :focus-visible { outline:3px solid #9bb8ff; outline-offset:2px; }
        .category-item { min-height:46px; }
        .modal-box { max-height:min(85vh,720px); overflow:auto; }
        .btn-submit, .btn-close-modal { min-height:46px; }
        .form-feedback { min-height:0; margin-top:10px; color:#b42318; font-size:13px; line-height:1.5; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <div class="header">
        <div class="header-icon" aria-hidden="true"><i class="fa-regular fa-pen-to-square"></i></div>
        <h1>Kirim Masukan</h1>
        <p class="subtitle">Sampaikan kritik dan saran tanpa mengisi nama atau login.</p>
    </div>

    <!-- FORM -->
    <form id="feedbackForm">
        <div class="form-group">
            <label for="pesan">Pesan <span class="required">*</span></label>
            <textarea id="pesan" name="pesan" placeholder="Tulis masukan atau unek-unek Anda di sini..." required></textarea>
        </div>

        <div class="form-group">
            <label id="kategoriLabel">Kategori</label>
            <button type="button" class="custom-select-trigger" id="selectKategoriBtn" aria-labelledby="kategoriLabel selectedKategoriText" aria-haspopup="dialog" aria-expanded="false" aria-controls="categoryModal">
                <span id="selectedKategoriText">Sikap / Kepribadian</span>
                <i class="fa-solid fa-chevron-down chevron" id="chevronIcon"></i>
            </button>
            <input type="hidden" id="kategori" name="kategori" value="Sikap / Kepribadian">

            <div class="dynamic-input-container" id="lainnyaContainer">
                <input type="text" id="kategoriLainnya" placeholder="Sebutkan kategori lainnya...">
            </div>
        </div>

        <div class="form-group">
            <label for="perbaikan">Saran Perbaikan</label>
            <textarea id="perbaikan" name="perbaikan" placeholder="Apa yang perlu diperbaiki? (opsional)"></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
            Kirim
            <i class="fa-regular fa-paper-plane btn-icon"></i>
        </button>
        <p class="form-feedback" id="formFeedback" role="status" aria-live="polite"></p>
    </form>

    <div class="footer">
        <i class="fa-regular fa-circle-check" aria-hidden="true"></i> Tidak perlu nama &bull; Hindari menulis data pribadi
    </div>
</div>

<!-- ===== MODAL KATEGORI ===== -->
<div class="modal-overlay" id="categoryModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="categoryTitle" tabindex="-1">
        <div class="modal-title" id="categoryTitle">Pilih Kategori Masukan</div>
        <ul class="category-list" role="listbox" aria-label="Kategori masukan">
            <li class="category-item" role="option" tabindex="0" data-value="Sikap / Kepribadian"><i class="fa-solid fa-user-gear" aria-hidden="true"></i> Sikap / Kepribadian</li>
            <li class="category-item" role="option" tabindex="0" data-value="Cara komunikasi"><i class="fa-solid fa-comments" aria-hidden="true"></i> Cara komunikasi</li>
            <li class="category-item" role="option" tabindex="0" data-value="Penampilan"><i class="fa-solid fa-shirt" aria-hidden="true"></i> Penampilan</li>
            <li class="category-item" role="option" tabindex="0" data-value="Lainnya"><i class="fa-solid fa-ellipsis" aria-hidden="true"></i> Yang lain... (Isi sendiri)</li>
        </ul>
    </div>
</div>

<!-- ===== MODAL SUKSES ===== -->
<div class="modal-overlay" id="successModal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="successTitle" tabindex="-1">
        <div class="success-icon"><i class="fa-regular fa-circle-check"></i></div>
        <div class="success-title" id="successTitle">Terkirim!</div>
        <div class="success-text">Terima kasih! Masukanmu sudah tersimpan secara anonim.</div>
        <button class="btn-close-modal" id="closeSuccessBtn">Tutup</button>
    </div>
</div>

<script>
    // ============================================================
    // KONFIGURASI
    // ============================================================
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzDQj02zqB64f3Svjj4hux92B-qc-coBRISQqztZncNPaFSCXm5iVN7vtdEBAj2Q_Y/exec';

    // ============================================================
    // ELEMEN
    // ============================================================
    const form = document.getElementById('feedbackForm');
    const submitBtn = document.getElementById('submitBtn');
    const formFeedback = document.getElementById('formFeedback');

    const selectKategoriBtn = document.getElementById('selectKategoriBtn');
    const chevronIcon = document.getElementById('chevronIcon');
    const categoryModal = document.getElementById('categoryModal');
    const selectedKategoriText = document.getElementById('selectedKategoriText');
    const kategoriHidden = document.getElementById('kategori');
    const categoryItems = document.querySelectorAll('.category-item');
    const lainnyaContainer = document.getElementById('lainnyaContainer');
    const kategoriLainnya = document.getElementById('kategoriLainnya');

    const successModal = document.getElementById('successModal');
    const closeSuccessBtn = document.getElementById('closeSuccessBtn');

    // ============================================================
    // BUKA MODAL KATEGORI
    // ============================================================
    selectKategoriBtn.addEventListener('click', () => {
        categoryModal.classList.add('active');
        categoryModal.setAttribute('aria-hidden', 'false');
        selectKategoriBtn.setAttribute('aria-expanded', 'true');
        chevronIcon.classList.add('open');
        categoryModal.querySelector('[role="dialog"]').focus();
    });

    // ============================================================
    // PILIH KATEGORI
    // ============================================================
    categoryItems.forEach(item => {
        item.addEventListener('click', () => {
            const value = item.getAttribute('data-value');
            categoryItems.forEach(option => option.setAttribute('aria-selected', String(option === item)));

            if (value === 'Lainnya') {
                selectedKategoriText.textContent = 'Lainnya...';
                kategoriHidden.value = 'Lainnya';
                lainnyaContainer.classList.add('show');
                kategoriLainnya.setAttribute('required', 'true');
                setTimeout(() => kategoriLainnya.focus(), 100);
            } else {
                selectedKategoriText.textContent = value;
                kategoriHidden.value = value;
                lainnyaContainer.classList.remove('show');
                kategoriLainnya.removeAttribute('required');
                kategoriLainnya.value = '';
            }

            categoryModal.classList.remove('active');
            categoryModal.setAttribute('aria-hidden', 'true');
            selectKategoriBtn.setAttribute('aria-expanded', 'false');
            chevronIcon.classList.remove('open');
            if (value !== 'Lainnya') selectKategoriBtn.focus();
        });
    });

    categoryModal.addEventListener('keydown', (event) => {
        const items = Array.from(categoryItems);
        const index = items.indexOf(document.activeElement);
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            const direction = event.key === 'ArrowDown' ? 1 : -1;
            items[(index + direction + items.length) % items.length].focus();
        } else if (event.key === 'Enter' || event.key === ' ') {
            if (items.includes(document.activeElement)) { event.preventDefault(); document.activeElement.click(); }
        } else if (event.key === 'Tab') {
            const current = items.indexOf(document.activeElement);
            const next = event.shiftKey ? (current <= 0 ? items.length - 1 : current - 1) : (current < 0 || current === items.length - 1 ? 0 : current + 1);
            event.preventDefault();
            items[next].focus();
        }
    });

    // ============================================================
    // TUTUP MODAL KATEGORI (klik overlay)
    // ============================================================
    categoryModal.addEventListener('click', (e) => {
        if (e.target === categoryModal) {
            categoryModal.classList.remove('active');
            categoryModal.setAttribute('aria-hidden', 'true');
            selectKategoriBtn.setAttribute('aria-expanded', 'false');
            chevronIcon.classList.remove('open');
            selectKategoriBtn.focus();
        }
    });

    // ============================================================
    // SUBMIT FORM
    // ============================================================
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        formFeedback.textContent = '';
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Mengirim <i class="fa-solid fa-spinner fa-spin btn-icon"></i>';

        const formData = new FormData(form);

        // Jika kategori "Lainnya", ambil dari input teks
        if (kategoriHidden.value === 'Lainnya') {
            const custom = kategoriLainnya.value.trim();
            formData.set('kategori', custom ? 'Lainnya: ' + custom : 'Lainnya');
        }

        fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => response.json())
            .then(result => {
                if (result.result !== 'success') throw new Error(result.error || result.message || 'Masukan gagal disimpan.');
                successModal.classList.add('active');
                successModal.setAttribute('aria-hidden', 'false');
                successModal.querySelector('[role="dialog"]').focus();

                // Reset form
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Kirim <i class="fa-regular fa-paper-plane btn-icon"></i>';
                form.reset();

                // Reset kategori ke default
                selectedKategoriText.textContent = 'Sikap / Kepribadian';
                kategoriHidden.value = 'Sikap / Kepribadian';
                lainnyaContainer.classList.remove('show');
                kategoriLainnya.removeAttribute('required');
            })
            .catch((error) => {
                console.error('Error:', error);
                formFeedback.textContent = error.message || 'Terjadi kendala saat mengirim. Silakan coba lagi.';
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Kirim <i class="fa-regular fa-paper-plane btn-icon"></i>';
            });
    });

    // ============================================================
    // TUTUP MODAL SUKSES
    // ============================================================
    closeSuccessBtn.addEventListener('click', () => {
        successModal.classList.remove('active');
        successModal.setAttribute('aria-hidden', 'true');
        submitBtn.focus();
    });

    successModal.addEventListener('click', (e) => {
        if (e.target === successModal) {
            successModal.classList.remove('active');
            successModal.setAttribute('aria-hidden', 'true');
            submitBtn.focus();
        }
    });

    document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
            categoryModal.classList.remove('active');
            categoryModal.setAttribute('aria-hidden', 'true');
            selectKategoriBtn.setAttribute('aria-expanded', 'false');
            chevronIcon.classList.remove('open');
            successModal.classList.remove('active');
            successModal.setAttribute('aria-hidden', 'true');
            if (!categoryModal.classList.contains('active')) selectKategoriBtn.focus();
        } else if (event.key === 'Tab' && categoryModal.classList.contains('active')) {
            event.preventDefault();
            categoryItems[0].focus();
        }
    });
</script>

</body>
</html>
