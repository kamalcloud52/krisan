<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#315ce8">
    <title>Cek Balasan Masukan</title>
    <style>
        :root { color-scheme:light; --ink:#172033; --muted:#65718a; --line:#e3e8f1; --brand:#315ce8; }
        * { box-sizing:border-box; }
        body { margin:0; min-height:100vh; display:grid; place-items:center; padding:22px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:radial-gradient(ellipse at top left,#eaf0ff 0,transparent 42%),#f4f6fb; }
        main { width:min(100%,520px); padding:34px; border:1px solid var(--line); border-radius:18px; background:#fff; box-shadow:0 18px 60px rgba(30,48,88,.09); }
        .icon { display:grid; place-items:center; width:54px; height:54px; border-radius:16px; margin:0 auto 16px; background:#eef3ff; color:var(--brand); font-size:25px; }
        h1, .intro { text-align:center; }
        h1 { margin:0 0 8px; font-size:22px; }
        .intro { margin:0 0 24px; color:var(--muted); font-size:14px; line-height:1.55; }
        label { display:block; margin-bottom:7px; font-size:13px; font-weight:650; }
        input { width:100%; min-height:48px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font:inherit; text-transform:uppercase; letter-spacing:.5px; }
        input:focus-visible, button:focus-visible, a:focus-visible { outline:3px solid #9bb8ff; outline-offset:2px; }
        button { width:100%; min-height:46px; margin-top:12px; border:0; border-radius:10px; background:var(--brand); color:#fff; font:inherit; font-weight:650; cursor:pointer; }
        button:disabled { opacity:.65; cursor:wait; }
        #result { margin-top:18px; padding:14px; border-radius:10px; background:#f6f8fc; color:#344054; font-size:14px; line-height:1.55; }
        #result:empty { display:none; }
        #result[data-state="error"] { color:#a12b24; background:#fff4f2; }
        #replyText { display:block; margin-top:10px; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--ink); }
        .privacy { margin-top:18px; color:var(--muted); font-size:12px; line-height:1.5; }
        .back { display:inline-block; margin-top:16px; color:var(--brand); font-size:13px; font-weight:600; text-decoration:none; }
        @media(max-width:480px) { main { padding:26px 20px; } }
    </style>
</head>
<body>
<main>
    <div class="icon" aria-hidden="true">↩</div>
    <h1>Cek balasan masukan</h1>
    <p class="intro">Masukkan kode tiket yang ditampilkan saat Anda mengirim masukan.</p>
    <form id="ticketForm">
        <label for="ticketCode">Kode tiket</label>
        <input id="ticketCode" name="ticketCode" autocomplete="off" autocapitalize="characters" maxlength="40" minlength="32" placeholder="Tempel kode tiket di sini" required>
        <button id="checkButton" type="submit">Cek balasan</button>
    </form>
    <div id="result" role="status" aria-live="polite"></div>
    <p class="privacy">Kode tiket bersifat rahasia dan menjadi kunci untuk melihat balasan Anda. Jangan bagikan kepada orang lain.</p>
    <a class="back" href="index.html">← Kembali ke formulir</a>
</main>
<script src="config.js"></script>
<script>
    const form = document.getElementById('ticketForm');
    const button = document.getElementById('checkButton');
    const result = document.getElementById('result');
    const ticketInput = document.getElementById('ticketCode');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const ticketCode = ticketInput.value.replace(/\s/g, '').toUpperCase();
        if (!/^[A-F0-9]{32}$/.test(ticketCode)) {
            showMessage('Format kode tiket tidak sesuai. Periksa kembali kode yang Anda simpan.', 'error');
            return;
        }
        button.disabled = true;
        button.textContent = 'Memeriksa…';
        showMessage('Sedang mencari balasan…');
        try {
            const body = new URLSearchParams({action:'checkReply', ticketCode});
            const response = await fetch(window.FEEDBACK_API_URL, {method:'POST', body});
            const data = await response.json();
            if (data.result !== 'success') throw new Error(data.message || 'Kode tiket tidak ditemukan.');
            if (!data.replyAvailable) {
                showMessage(data.message || 'Belum ada balasan. Coba cek lagi nanti.');
                return;
            }
            result.replaceChildren();
            result.dataset.state = 'success';
            const heading = document.createElement('strong');
            heading.textContent = 'Balasan untuk Anda';
            const reply = document.createElement('span');
            reply.id = 'replyText';
            reply.textContent = data.reply || '';
            result.append(heading, reply);
            if (data.updatedAt) {
                const time = document.createElement('small');
                time.textContent = `Dikirim ${new Date(data.updatedAt).toLocaleString('id-ID')}`;
                reply.after(time);
            }
        } catch (error) {
            showMessage(error.message || 'Tidak dapat terhubung ke server. Coba lagi.', 'error');
        } finally {
            button.disabled = false;
            button.textContent = 'Cek balasan';
        }
    });

    function showMessage(message, state = '') {
        result.replaceChildren();
        result.dataset.state = state;
        result.textContent = message;
    }
</script>
</body>
</html>
