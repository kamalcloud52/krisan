<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Kritik & Saran</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- CSS Utama -->
    <link rel="stylesheet" href="/admin/style.css">
    
    <meta name="theme-color" content="#315ce8">
</head>
<body>

<!-- ==================== LOGIN PAGE ==================== -->
<div class="login-page" id="loginPage">
    <div class="login-container">
        <div class="login-icon">
            <i class="fas fa-lock"></i>
        </div>
        <h2>Admin Access</h2>
        <p class="subtitle">Masukkan password untuk mengakses dashboard</p>

        <div class="error-msg" id="loginError" role="alert" aria-live="assertive">
            <i class="fas fa-circle-exclamation"></i> <span id="errorText">Password salah! Silakan coba lagi.</span>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="passwordInput">Password</label>
            <input type="password" id="passwordInput" name="password" autocomplete="current-password" placeholder="Masukkan password admin..." required autofocus>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">
                <span id="loginBtnText">Masuk</span> <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <p class="login-footer">
            <i class="fas fa-shield"></i> Hanya untuk akses terbatas
        </p>
    </div>
</div>

<!-- ==================== MAIN APP ==================== -->
<div id="appContent">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-envelope"></i>
            <h2>Feedback Admin</h2>
            <small>Manajemen Kritik & Saran</small>
        </div>

        <button type="button" class="nav-item active" onclick="loadDashboard()" aria-current="page">
            <i class="fas fa-chart-pie"></i> Dashboard
        </button>
        <button type="button" class="nav-item" onclick="loadData()">
            <i class="fas fa-list"></i> Semua Masukan
            <span class="badge" id="totalBadge">0</span>
        </button>
        <button type="button" class="nav-item" onclick="loadUnread()">
            <i class="fas fa-envelope"></i> Belum Dibaca
            <span class="badge unread" id="unreadBadge">0</span>
        </button>

        <div class="nav-divider"></div>

        <button type="button" class="nav-item" onclick="refreshData()">
            <i class="fas fa-rotate"></i> Refresh
        </button>
        <a class="nav-item" href="https://kritik-saran-kamal.pages.dev" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-arrow-up-right-from-square"></i> Buka Form
        </a>

        <div class="nav-divider"></div>

        <button type="button" class="nav-item logout" onclick="handleLogout()">
            <i class="fas fa-right-from-bracket"></i> Logout
        </button>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- Header -->
        <div class="page-header">
            <div class="page-header-left">
                <button type="button" class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Buka navigasi" aria-expanded="false" aria-controls="sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            <div class="header-actions">
                <button onclick="refreshData()"><i class="fas fa-rotate"></i> Refresh</button>
                <button onclick="exportData()"><i class="fas fa-download"></i> Export</button>
            </div>
        </div>

        <!-- Stats -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card primary">
                <span class="stat-icon"><i class="fas fa-inbox"></i></span>
                <div class="stat-number" id="statTotal">0</div>
                <div class="stat-label">Total Masukan</div>
            </div>
            <div class="stat-card danger">
                <span class="stat-icon"><i class="fas fa-envelope"></i></span>
                <div class="stat-number" id="statUnread">0</div>
                <div class="stat-label">Belum Dibaca</div>
            </div>
            <div class="stat-card success">
                <span class="stat-icon"><i class="fas fa-circle-check"></i></span>
                <div class="stat-number" id="statRead">0</div>
                <div class="stat-label">Sudah Dibaca</div>
            </div>
            <div class="stat-card warning">
                <span class="stat-icon"><i class="fas fa-tag"></i></span>
                <div class="stat-number" id="statCategories">0</div>
                <div class="stat-label">Kategori Terisi</div>
            </div>
        </div>

        <!-- Filter -->
        <div class="filter-bar">
            <input type="search" id="searchInput" aria-label="Cari pesan, kategori, atau saran" placeholder="Cari pesan..." oninput="applyFilters()">
            <select id="categoryFilter" aria-label="Filter kategori" onchange="applyFilters()">
                <option value="">Semua Kategori</option>
                <option value="Sikap / Kepribadian">Sikap / Kepribadian</option>
                <option value="Cara komunikasi">Cara komunikasi</option>
                <option value="Penampilan">Penampilan</option>
                <option value="Lainnya">Lainnya</option>
            </select>
            <select id="statusFilter" aria-label="Filter status baca" onchange="applyFilters()">
                <option value="">Semua Status</option>
                <option value="Belum Dibaca">Belum Dibaca</option>
                <option value="Sudah Dibaca">Sudah Dibaca</option>
            </select>
        </div>

        <!-- Table -->
        <div class="table-container">
            <div id="tableContent">
                <div class="loading">
                    <i class="fas fa-spinner fa-spin"></i>
                    <span>Memuat data...</span>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ==================== MODAL DETAIL ==================== -->
<div class="modal-overlay" id="detailModal" aria-hidden="true">
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="detailTitle" tabindex="-1">
        <h3 id="detailTitle"><i class="fas fa-file-lines" aria-hidden="true"></i> Detail Masukan</h3>
        <div id="detailContent"></div>
        <button class="modal-close" onclick="closeDetail()">Tutup</button>
    </div>
</div>

<!-- ==================== TOAST NOTIFICATION ==================== -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- ==================== JAVASCRIPT ==================== -->
<!-- Script Utama -->
<script src="/admin/script.js"></script>

</body>
</html>
